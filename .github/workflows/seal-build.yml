name: seal-build

# Build-and-pack only: the test suite runs on Travis (.travis.yml).
on:
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
      - name: Build jar
        run: ./mvnw -B -V package -DskipTests -pl main -am
      - uses: actions/upload-artifact@v4
        with:
          name: objenesis-jar
          path: main/target/objenesis-2.6.jar
          if-no-files-found: error
